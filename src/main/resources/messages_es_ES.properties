help.instructions.header=\n----------------------------------------\n  GUÍA DE NAVEGACIÓN E INSTRUCCIONES DEL SISTEMA  \n----------------------------------------
help.instructions.title=Este sistema gestiona billeteras de criptoactivos y sus transacciones.\nA continuación se detalla cómo navegar y utilizar cada menú:
help.instructions.wallet=1. MENÚ BILLETERA (Opción 1 en el Menú Principal):\n\
   - Añadir Billetera: Permite registrar una nueva billetera proporcionando un ID único, nombre del titular y nombre del agente/bróker.\n\
   - Buscar Billetera: Encuentra y muestra los datos de una billetera específica mediante el ID informado.\n\
   - Editar Billetera: Permite modificar la información de titular y agente de una billetera existente mediante su ID.\n\
   - Eliminar Billetera: Elimina permanentemente una billetera del sistema tras una confirmación expresa del usuario.
help.instructions.transaction=2. MENÚ TRANSACCIÓN (Opción 2 en el Menú Principal):\n\
   - Comprar moneda virtual: Añade una cantidad de monedas digitales al saldo de una billetera indicada (operación tipo CASH_IN).\n\
   - Vender moneda virtual: Retira una cantidad de monedas del saldo de una billetera indicada, siempre que haya saldo suficiente (CASH_OUT).
help.instructions.reports=3. MENÚ INFORMES (Opción 3 en el Menú Principal):\n\
   - Estado Financiero: Muestra los movimientos de una billetera con un cálculo detallado de gastos, ingresos, valor actual y ganancia/pérdida.\n\
   - Listar por ID: Lista las billeteras registradas ordenadas de forma ascendente por ID.\n\
   - Listar por Titular: Lista las billeteras registradas ordenadas alfabéticamente por el nombre del titular.\n\
   - Saldo Actual: Muestra la información de la billetera y su saldo acumulado de monedas.\n\
   - Historial de Transacciones: Muestra la lista cronológica de compras y ventas de una billetera, incluyendo el flujo financiero de cada operación.\n\
   - Ganancia o Pérdida Total: Presenta el saldo de monedas y la ganancia o pérdida financiera neta acumulada de cada billetera.
help.instructions.tip=CONSEJO: En cualquier submenú, ingrese '0' para volver al menú anterior.


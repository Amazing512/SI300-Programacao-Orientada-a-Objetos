help.instructions.header=\n----------------------------------------\n GUÍA DE NAVEGACIÓN E INSTRUCCIONES DEL SISTEMA \n----------------------------------------
help.instructions.title=Este sistema gestiona carteras de criptoactivos y sus transacciones.\nA continuación se detalla cómo navegar y utilizar cada menú:
help.instructions.wallet=1. MENÚ CARTERA (Opción 1 en el Menú Principal):\n\
   - Agregar Cartera: Registra una nueva cartera ingresando ID único, nombre del titular y agente de bolsa.\n\
   - Buscar Cartera: Muestra los datos de una cartera específica mediante su ID.\n\
   - Editar Cartera: Permite modificar titular y agente de bolsa de una cartera existente.\n\
   - Eliminar Cartera: Elimina permanentemente una cartera tras confirmación expresa.
help.instructions.transaction=2. MENÚ TRANSACCIÓN (Opción 2 en el Menú Principal):\n\
   - Comprar moneda virtual: Agrega una cantidad de monedas digitales al saldo (operación CASH_IN).\n\
   - Vender moneda virtual: Retira una cantidad de monedas del saldo, siempre que haya saldo suficiente (CASH_OUT).
help.instructions.reports=3. MENÚ INFORMES (Opción 3 en el Menú Principal):\n\
   - Informe Financiero: Muestra movimientos con cálculo de gastos, ingresos, valor actual y ganancia/pérdida.\n\
   - Listar por ID: Lista las carteras ordenadas de forma ascendente por ID.\n\
   - Listar por Titular: Lista las carteras ordenadas alfabéticamente por titular.\n\
   - Saldo Actual: Muestra datos de la cartera y su saldo acumulado de monedas.\n\
   - Historial de Transacciones: Muestra la lista cronológica de compras y ventas.\n\
   - Ganancia o Pérdida Total: Muestra el saldo y la ganancia o pérdida neta por cartera.\n\
   - Liquidación de Resultados: Calcula el precio promedio, ganancia/pérdida operacional y simulación de venta total.
help.instructions.tip=CONSEJO: En cualquier submenú, ingrese '0' para volver al menú anterior.


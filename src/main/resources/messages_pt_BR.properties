helpMenu.viewInstructions=Ver guia de navegação do sistema
helpMenu.viewCredits=Ver créditos dos desenvolvedores
help.instructions.header=\n---------------------------------------------------------------\n          GUIA DE NAVEGAÇÃO E INSTRUÇÕES DO SISTEMA       \n---------------------------------------------------------------\n
help.instructions=Este sistema gerencia carteiras de criptoativos e suas transações.\nAbaixo está o detalhamento de como navegar e utilizar cada menu:\n\n1. MENU CARTEIRA (Opção 1 no Menu Principal):\n   - Incluir Carteira: Permite cadastrar uma nova carteira fornecendo um\n     ID único, nome do titular e o nome da corretora.\n   - Buscar Carteira: Encontra e exibe os dados de uma carteira específica\n     através do ID informado.\n   - Editar Carteira: Permite alterar as informações de titular e corretora\n     de uma carteira já existente mapeada pelo ID.\n   - Remover Carteira: Exclui permanentemente uma carteira do sistema após\n     uma confirmação expressa do usuário.\n\n2. MENU TRANSAÇÃO (Opção 2 no Menu Principal):\n   - Comprar moeda virtual: Adiciona uma quantidade de moedas digitais ao\n     saldo de uma carteira informada (operação do tipo CASH_IN).\n   - Vender moeda virtual: Retira uma quantidade de moedas do saldo de uma\n     carteira informada, desde que haja saldo suficiente (CASH_OUT).\n\n3. MENU RELATÓRIOS (Opção 3 no Menu Principal):\n   - Relatório do Extrato Financeiro: Exibe o histórico cronológico de todas\n     as compras e vendas vinculadas a uma determinada carteira.\n   - Classificação das Carteiras por Saldo: Gera um ranking geral ordenando\n     todas as carteiras cadastradas do maior para o menor saldo atual.\n\n4. MENU ORÁCULO (Opção 4 no Menu Principal):\n   - Permite consultar as cotações diárias atuais e análises avançadas de\n     preço para tomada de decisão no mercado virtual.\n\nDICA: Em qualquer submenu, digite '0' para retornar ao menu anterior.\n
help.credits.header=\n----------------------------------------\n               CRÉDITOS                 \n----------------------------------------
help.credits=EQUIPE DE DESENVOLVIMENTO (SI300 - UNICAMP 2026):\n\n GERÊNCIA DE PROJETO\n  - Miguel Barcellos: Planejamento, prazos, monitoramento do Git.\n\n ARQUITETURA DE SOFTWARE\n  - Gabriela Nogueira: Padrão MVC, POO e revisão de código.\n\n VIEW & CONTROLLER (CLI e Interface com Usuário)\n  - Luiza Brum: Telas interativas, validações de fluxo do sistema.\n\n MODEL & DAO (Modelagem e Persistência em Memória)\n  - Matheus Mastelini e Vitor Cunha: Regras de negócio e DAOs em memória.\n\n BANCO DE DADOS & ORÁCULO (Conexão JDBC e Cotações Externa)\n  - Guilherme Kauã, Gustavo Domingues e Samuel Germiniani\n



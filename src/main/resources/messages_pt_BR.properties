help.instructions.header=\n----------------------------------------\n  GUIA DE NAVEGAÇÃO E INSTRUÇÕES DO SISTEMA  \n----------------------------------------
help.instructions.title=Este sistema gerencia carteiras de criptoativos e suas transações.\nAbaixo está o detalhamento de como navegar e utilizar cada menu:
help.instructions.wallet=1. MENU CARTEIRA (Opção 1 no Menu Principal):\n\
   - Incluir Carteira: Permite cadastrar uma nova carteira fornecendo um ID único, nome do titular e o nome da corretora.\n\
   - Buscar Carteira: Encontra e exibe os dados de uma carteira específica através do ID informado.\n\
   - Editar Carteira: Permite alterar as informações de titular e corretora de uma carteira já existente mapeada pelo ID.\n\
   - Remover Carteira: Exclui permanentemente uma carteira do sistema após uma confirmação expressa do usuário.
help.instructions.transaction=2. MENU TRANSAÇÃO (Opção 2 no Menu Principal):\n\
   - Comprar moeda virtual: Adiciona uma quantidade de moedas digitais ao saldo de uma carteira informada (operação do tipo CASH_IN).\n\
   - Vender moeda virtual: Retira uma quantidade de moedas do saldo de uma carteira informada, desde que haja saldo suficiente (CASH_OUT).
help.instructions.reports=3. MENU RELATÓRIOS (Opção 3 no Menu Principal):\n\
   - Extrato Financeiro: Exibe as movimentações de uma carteira com cálculo detalhado de gastos, receitas, valor atual e lucro/prejuízo.\n\
   - Listar por ID: Lista as carteiras cadastradas ordenadas em ordem crescente de ID.\n\
   - Listar por Titular: Lista as carteiras cadastradas ordenadas em ordem alfabética do nome do titular.\n\
   - Saldo Atual: Exibe as informações da carteira e seu saldo atual acumulado de moedas.\n\
   - Histórico de Movimentação: Exibe a lista cronológica de compras e vendas de uma carteira, incluindo o fluxo financeiro de cada operação.\n\
   - Ganho ou Perda Total: Apresenta o saldo de moedas e o ganho ou perda financeira líquida acumulada de cada carteira cadastrada.
help.instructions.tip=DICA: Em qualquer submenu, digite '0' para retornar ao menu anterior.


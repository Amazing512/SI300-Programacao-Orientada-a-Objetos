help.instructions.header=\n----------------------------------------\n  SYSTEM NAVIGATION AND INSTRUCTIONS GUIDE \n----------------------------------------
help.instructions.title=This system manages crypto asset wallets and their transactions.\nBelow is the breakdown of how to navigate and use each menu:
help.instructions.wallet=1. WALLET MENU (Option 1 in Main Menu):\n\
   - Add Wallet: Allows registering a new wallet by providing a unique ID, holder name, and broker name.\n\
   - Search Wallet: Finds and displays data for a specific wallet using the provided ID.\n\
   - Edit Wallet: Allows changing holder and broker information for an existing wallet mapped by ID.\n\
   - Remove Wallet: Permanently deletes a wallet from the system after express user confirmation.
help.instructions.transaction=2. TRANSACTION MENU (Option 2 in Main Menu):\n\
   - Buy virtual currency: Adds an amount of digital coins to the balance of a specified wallet (CASH_IN operation).\n\
   - Sell virtual currency: Removes an amount of coins from the balance of a specified wallet, provided there is sufficient balance (CASH_OUT).
help.instructions.reports=3. REPORTS MENU (Option 3 in Main Menu):\n\
   - Financial Statement: Displays wallet transactions with detailed calculation of expenses, revenue, current value, and profit/loss.\n\
   - List by ID: Lists registered wallets sorted in ascending order of ID.\n\
   - List by Holder: Lists registered wallets sorted alphabetically by holder name.\n\
   - Current Balance: Displays wallet information and its current accumulated coin balance.\n\
   - Transaction History: Displays the chronological list of buys and sells for a wallet, including the financial flow of each operation.\n\
   - Total Gain or Loss: Presents the coin balance and the net accumulated financial gain or loss for each registered wallet.
help.instructions.tip=TIP: In any submenu, type '0' to return to the previous menu.


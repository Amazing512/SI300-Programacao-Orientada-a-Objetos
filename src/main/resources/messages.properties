help.instructions.header=\n----------------------------------------\n   SYSTEM NAVIGATION GUIDE & INSTRUCTIONS\n----------------------------------------
help.instructions.title=This system manages crypto asset wallets and their transactions.\nBelow is the detailed breakdown of how to navigate and use each menu:
help.instructions.wallet=1. WALLET MENU (Option 1 in Main Menu):\n\
   - Add Wallet: Register a new wallet by providing a unique ID, holder's name, and broker name.\n\
   - Search Wallet: Find and display details of a specific wallet using its ID.\n\
   - Edit Wallet: Update holder and broker information for an existing wallet mapped by ID.\n\
   - Remove Wallet: Permanently delete a wallet from the system after explicit user confirmation.
help.instructions.transaction=2. TRANSACTION MENU (Option 2 in Main Menu):\n\
   - Buy Virtual Coin: Add a quantity of digital coins to a wallet's balance (CASH_IN operation).\n\
   - Sell Virtual Coin: Withdraw a quantity of digital coins from a wallet's balance, provided there are sufficient funds (CASH_OUT).
help.instructions.reports=3. REPORTS MENU (Option 3 in Main Menu):\n\
   - Financial Report: Displays wallet transactions with detailed calculations of expenses, revenues, current value, and profit/loss.\n\
   - List by ID: Lists registered wallets sorted in ascending order of ID.\n\
   - List by Holder: Lists registered wallets sorted alphabetically by holder's name.\n\
   - Current Balance: Displays wallet details and its cumulative coin balance.\n\
   - Transaction History: Displays chronological list of buys and sells, including cash flows.\n\
   - Total Gain or Loss: Shows coin balance and net accumulated financial gain or loss per wallet.\n\
   - Result Settlement: Calculates weighted average price, operating profit/loss, and simulates total liquidation.
help.instructions.tip=TIP: In any submenu, type '0' to return to the previous menu.


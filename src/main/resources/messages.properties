help.instructions.header=\n---------------------------------------------------------------\n          SYSTEM NAVIGATION GUIDE AND INSTRUCTIONS       \n---------------------------------------------------------------\n
help.instructions=This system manages cryptoasset wallets and their transactions.\nBelow is the breakdown of how to navigate and use each menu:\n\n1. WALLET MENU (Option 1 on Main Menu):\n   - Include Wallet: Allows registering a new wallet by providing a\n     unique ID, holder's name, and broker name.\n   - Search Wallet: Finds and displays the data of a specific wallet\n     through the provided ID.\n   - Edit Wallet: Allows changing the holder and broker information\n     of an existing wallet mapped by ID.\n   - Remove Wallet: Permanently deletes a wallet from the system after\n     express user confirmation.\n\n2. TRANSACTION MENU (Option 2 on Main Menu):\n   - Buy virtual coin: Adds an amount of digital coins to the\n     balance of a specified wallet (CASH_IN type operation).\n   - Sell virtual coin: Withdraws an amount of coins from the balance of a\n     specified wallet, provided there is sufficient balance (CASH_OUT).\n\n3. REPORT MENU (Option 3 on Main Menu):\n   - Financial Statement Report: Displays the chronological history of all\n     buys and sells linked to a specific wallet.\n   - Wallets Ranking by Balance: Generates a general ranking ordering\n     all registered wallets from highest to lowest current balance.\n\n4. ORACLE MENU (Option 4 on Main Menu):\n   - Allows consulting current daily quotes and advanced price\n     analyses for decision making in the virtual market.\n\nTIP: In any submenu, type '0' to return to the previous menu.\n
help.credits.header=\n----------------------------------------\n               CREDITS                  \n----------------------------------------
help.credits=DEVELOPMENT TEAM (SI300 - UNICAMP 2026):\n\n PROJECT MANAGEMENT\n  - Miguel Barcellos: Planning, deadlines, Git monitoring.\n\n SOFTWARE ARCHITECTURE\n  - Gabriela Nogueira: MVC pattern, OOP, and code review.\n\n VIEW & CONTROLLER (CLI and User Interface)\n  - Luiza Brum: Interactive screens, system flow validations.\n\n MODEL & DAO (Modeling and In-Memory Persistence)\n  - Matheus Mastelini and Vitor Cunha: Business rules and in-memory DAOs.\n\n DATABASE & ORACLE (JDBC Connection and External Quotes)\n  - Guilherme Kauan, Gustavo Domingues and Samuel Germiniani\n


